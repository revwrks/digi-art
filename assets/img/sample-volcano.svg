<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7e5f"/>
      <stop offset="45%" stop-color="#feb47b"/>
      <stop offset="100%" stop-color="#ffeccc"/>
    </linearGradient>
    <linearGradient id="ashGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4238" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8c7866" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="magmaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffb00"/>
      <stop offset="50%" stop-color="#ff4500"/>
      <stop offset="100%" stop-color="#b22222"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#skyGrad)"/>
  <!-- Smoke Plume -->
  <circle cx="300" cy="110" r="70" fill="url(#ashGrad)"/>
  <circle cx="250" cy="90" r="55" fill="url(#ashGrad)"/>
  <circle cx="350" cy="85" r="60" fill="url(#ashGrad)"/>
  <circle cx="280" cy="50" r="45" fill="url(#ashGrad)"/>
  <circle cx="330" cy="45" r="40" fill="url(#ashGrad)"/>
  <!-- Mountain Body -->
  <polygon points="50,400 300,180 550,400" fill="#3d312a"/>
  <polygon points="120,400 300,180 480,400" fill="#2c221c"/>
  <!-- Lava Streams -->
  <path d="M 300 180 Q 280 230 260 290 T 230 400" stroke="url(#magmaGrad)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 300 180 Q 320 240 335 310 T 360 400" stroke="url(#magmaGrad)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 295 190 Q 290 260 300 350 T 295 400" stroke="url(#magmaGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Crater glow -->
  <ellipse cx="300" cy="180" rx="35" ry="12" fill="#ffdd00"/>
  <!-- Foreground ground -->
  <path d="M 0 360 Q 150 330 300 350 T 600 360 L 600 400 L 0 400 Z" fill="#1b1512"/>
  <!-- Educational Labels -->
  <rect x="20" y="20" width="160" height="32" rx="6" fill="rgba(0,0,0,0.6)"/>
  <text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold">IPS Geografi • Erupsi</text>
</svg>
