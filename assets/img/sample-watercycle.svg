<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="waterSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbf2f6"/>
      <stop offset="60%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#waterSky)"/>
  <!-- Sun -->
  <circle cx="90" cy="80" r="45" fill="#fbc02d"/>
  <circle cx="90" cy="80" r="55" fill="#fff59d" opacity="0.4"/>
  <!-- Mountain (Condensation area) -->
  <polygon points="260,320 420,130 580,320" fill="#78909c"/>
  <polygon points="360,320 420,130 480,320" fill="#546e7a"/>
  <!-- Snow cap -->
  <polygon points="395,160 420,130 445,160 435,165 420,155 405,165" fill="#ffffff"/>
  <!-- Sea / Ocean -->
  <path d="M 0 300 Q 150 285 300 305 T 600 300 L 600 400 L 0 400 Z" fill="url(#seaGrad)"/>
  <!-- Clouds -->
  <g fill="#eceff1" opacity="0.95">
    <ellipse cx="280" cy="90" rx="60" ry="30"/>
    <ellipse cx="320" cy="80" rx="50" ry="28"/>
    <ellipse cx="250" cy="95" rx="40" ry="22"/>
  </g>
  <!-- Rain / Precipitation -->
  <g stroke="#0288d1" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <line x1="280" y1="130" x2="270" y2="160"/>
    <line x1="310" y1="135" x2="300" y2="165"/>
    <line x1="340" y1="128" x2="330" y2="158"/>
    <line x1="260" y1="140" x2="250" y2="170"/>
  </g>
  <!-- Evaporation Arrows -->
  <g stroke="#f57c00" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 120 280 Q 110 240 120 200"/>
    <path d="M 160 270 Q 170 230 160 190"/>
    <!-- arrowheads -->
    <polyline points="112,210 120,200 128,210"/>
    <polyline points="152,200 160,190 168,200"/>
  </g>
  <!-- Labels -->
  <rect x="20" y="20" width="160" height="32" rx="6" fill="rgba(13,71,161,0.85)"/>
  <text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold">IPA • Siklus Air</text>
  <rect x="80" y="225" width="105" height="24" rx="4" fill="rgba(255,255,255,0.9)"/>
  <text x="88" y="242" fill="#e65100" font-family="sans-serif" font-size="12" font-weight="bold">Evaporasi ↑</text>
  <rect x="365" y="100" width="115" height="24" rx="4" fill="rgba(255,255,255,0.9)"/>
  <text x="372" y="117" fill="#01579b" font-family="sans-serif" font-size="12" font-weight="bold">Presipitasi ↓</text>
</svg>
