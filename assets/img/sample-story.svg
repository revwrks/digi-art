<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="forestSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#forestSky)"/>
  <!-- Distant trees -->
  <circle cx="80" cy="200" r="90" fill="#a5d6a7"/>
  <circle cx="200" cy="180" r="100" fill="#81c784"/>
  <circle cx="340" cy="190" r="85" fill="#a5d6a7"/>
  <circle cx="480" cy="170" r="110" fill="#66bb6a"/>
  <!-- River -->
  <path d="M 0 280 C 150 260 250 320 600 270 L 600 400 L 0 400 Z" fill="#4fc3f7"/>
  <!-- Riverbank grass -->
  <path d="M 0 310 C 120 290 180 340 320 330 C 440 320 520 350 600 340 L 600 400 L 0 400 Z" fill="#43a047"/>
  <!-- Kancil (Deer) Cartoon Character -->
  <g transform="translate(140, 220)">
    <!-- Body -->
    <ellipse cx="60" cy="60" rx="35" ry="22" fill="#d87d36"/>
    <!-- Head -->
    <ellipse cx="25" cy="35" rx="16" ry="14" fill="#e5914c"/>
    <circle cx="20" cy="32" r="3.5" fill="#212121"/>
    <circle cx="21" cy="31" r="1" fill="#ffffff"/>
    <!-- Snout -->
    <path d="M 12 37 Q 8 40 12 43 Z" fill="#5d4037"/>
    <!-- Ears -->
    <polygon points="26,24 33,8 37,23" fill="#bf6527"/>
    <polygon points="18,25 21,12 27,24" fill="#e5914c"/>
    <!-- Legs -->
    <rect x="35" y="75" width="6" height="30" rx="3" fill="#d87d36"/>
    <rect x="48" y="75" width="6" height="30" rx="3" fill="#bf6527"/>
    <rect x="75" y="75" width="6" height="30" rx="3" fill="#d87d36"/>
    <rect x="85" y="75" width="6" height="30" rx="3" fill="#bf6527"/>
  </g>
  <!-- Buaya (Crocodile) in river -->
  <g transform="translate(380, 260)">
    <!-- Back ridges -->
    <path d="M 10 20 L 25 10 L 40 20 L 55 10 L 70 20 L 85 10 L 100 20 L 115 10 L 130 20" stroke="#2e7d32" stroke-width="4" fill="none"/>
    <!-- Body in water -->
    <ellipse cx="70" cy="30" rx="65" ry="18" fill="#388e3c"/>
    <!-- Eyes -->
    <circle cx="35" cy="18" r="6" fill="#fbc02d"/>
    <circle cx="35" cy="18" r="2.5" fill="#1b5e20"/>
    <!-- Snout -->
    <ellipse cx="15" cy="28" rx="20" ry="10" fill="#43a047"/>
  </g>
  <!-- Labels -->
  <rect x="20" y="20" width="220" height="32" rx="6" fill="rgba(46,125,50,0.85)"/>
  <text x="30" y="42" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold">B. Indonesia • Ilustrasi Fabel</text>
</svg>
